[package]
name = "friends-live"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
livekit = { version = "0.11", default-features = false, features = ["tokio", "rustls-tls-webpki-roots"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_45"] }
# Wayland screen capture runs the portal session on a glib main loop.
livekit = { version = "0.11", default-features = false, features = ["glib-main-loop"] }
