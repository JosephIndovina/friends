<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Friends Live</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Friends Live</h1>
        <p id="who" class="quiet"></p>
      </header>

      <section id="status" class="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <strong id="status-title"></strong>
          <p id="status-detail" class="quiet"></p>
        </div>
      </section>

      <p id="error" class="error" role="alert" hidden></p>

      <div class="actions">
        <button id="primary" class="btn btn-primary"></button>
        <button id="site" class="btn btn-quiet">Open the site</button>
      </div>

      <section class="settings">
        <div class="field">
          <span>Window</span>
          <div class="row">
            <p id="window" class="window-name"></p>
            <button id="change" class="btn btn-quiet btn-s">Change window</button>
          </div>
          <small class="quiet">The sound comes from the app that owns this window, never from your voice chat. Next time it's reused without asking.</small>
        </div>

        <label class="field">
          <span>Quality</span>
          <select id="quality"></select>
          <small class="quiet">Everyone watching gets this quality. Your upload speed needs to be higher than the bitrate.</small>
        </label>

        <label class="check">
          <input id="auto" type="checkbox" />
          <span>Go live as soon as the site opens this app</span>
        </label>
      </section>
    </main>
  </body>
</html>
