# TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML, then paste this file.
# Dataset NAS/friends holds .env (secrets); NAS/friends/data holds the database (owned by uid 1000).
name: friends

services:
  app:
    image: ghcr.io/josephindovina/friends:latest
    restart: unless-stopped
    env_file: /mnt/NAS/friends/.env
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://friends.indovina.dev
      DATA_DIR: /data
    volumes:
      - /mnt/NAS/friends/data:/data
    extra_hosts:
      - host.docker.internal:host-gateway   # reach LiveKit's signalling port on the host
    # No published ports: the Cloudflare tunnel reaches it on the internal network.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: /mnt/NAS/friends/.env   # needs TUNNEL_TOKEN
    depends_on: [app]

  # Cast: self-hosted LiveKit. Host networking so WebRTC can use the forwarded ports directly
  # (TCP 7881, UDP 3478 TURN, UDP 50000-50200 media). Signalling (7880) is proxied by the app.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - /mnt/NAS/friends/livekit.yaml:/etc/livekit.yaml:ro

  # Keeps rtc.indovina.dev (DNS-only, grey cloud) pointed at your home IP for Cast/LiveKit.
  ddns:
    image: favonia/cloudflare-ddns:1
    restart: unless-stopped
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    user: "1000:1000"
    env_file: /mnt/NAS/friends/.env   # needs CLOUDFLARE_API_TOKEN
    environment:
      DOMAINS: rtc.indovina.dev
      PROXIED: "false"
      IP6_PROVIDER: none
