name: CI

on:
  push:
    # live-* branches build the desktop app too, so it can be checked before it reaches main (which deploys).
    branches: [main, "live-**"]
  pull_request:

permissions:
  contents: read

jobs:
  # The desktop app takes 15-25 minutes to build, so it's only rebuilt when something it's made from changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      live: ${{ steps.filter.outputs.live }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            live:
              - "apps/live/**"
              - ".github/workflows/ci.yml"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # The Friends Live desktop app for Ubuntu. The site serves the .deb from /download.
  live-linux:
    needs: changes
    if: needs.changes.outputs.live == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/live
    env:
      # libwebrtc is built against Chromium's libc++: it needs clang 21+, and won't link with GCC.
      CC: clang-21
      CXX: clang++-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
      # cuda.h at build time compiles in NVENC (graphics-card encoding); the libraries themselves load at run time
      # only on machines with an NVIDIA driver, so the .deb works everywhere.
      CUDA_HOME: /tmp/cuda/usr/local/cuda-12.9/targets/x86_64-linux
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 21
          sudo apt-get install -y --no-install-recommends libclang-21-dev
          wget -qO /tmp/cudart.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-cudart-dev-12-9_12.9.79-1_amd64.deb
          dpkg-deb -x /tmp/cudart.deb /tmp/cuda && test -f "$CUDA_HOME/include/cuda.h"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev \
            libdbus-1-dev libglib2.0-dev libgbm-dev libdrm-dev libva-dev \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev libxcomposite-dev libxtst-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/live
          # webrtc-sys only looks for cuda.h when it's compiled; a cached build from without it would keep NVENC out.
          key: cuda-12.9
      - run: cargo test
      - run: npx --yes @tauri-apps/cli@2 build --bundles deb
      - run: mkdir -p out && cp "target/release/bundle/deb/"*.deb out/friends-live_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: live-linux
          path: apps/live/out/friends-live_amd64.deb
          if-no-files-found: error

  # The Friends Live desktop app for Windows: an installer that needs no admin rights.
  live-windows:
    needs: changes
    if: needs.changes.outputs.live == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/live
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/live
      - run: cargo test
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - run: mkdir -p out && cp target/release/bundle/nsis/*-setup.exe out/friends-live_x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: live-windows
          path: apps/live/out/friends-live_x64-setup.exe
          if-no-files-found: error

  # New installers from main replace the ones on the "friends-live" release, which is where every image takes
  # them from, so a site-only change still ships the latest app.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.live == 'true'
    needs: [changes, live-linux, live-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: live-linux
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: live-windows
          path: out
      - run: |
          gh release view friends-live >/dev/null 2>&1 || gh release create friends-live --title "Friends Live" --notes "Latest desktop app installers, served by the site at /download." --target "$GITHUB_SHA"
          gh release upload friends-live out/friends-live_amd64.deb out/friends-live_x64-setup.exe --clobber

  image:
    # Runs whether or not the app was rebuilt (release skipped), but not if the app build or release failed.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Desktop app installers
        run: gh release download friends-live --pattern "friends-live_*" --dir downloads --clobber
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/friends
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
