name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # The Friends Live desktop app for Ubuntu. The site serves the .deb from /download.
  live-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/live
    env:
      CC: clang
      CXX: clang++ # libwebrtc is built against Chromium's libc++ and won't link with GCC
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libdbus-1-dev libglib2.0-dev libgbm-dev libdrm-dev libva-dev \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev libxcomposite-dev libxtst-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/live
      - run: cargo test
      - run: npx --yes @tauri-apps/cli@2 build --bundles deb
      - run: mkdir -p out && cp "target/release/bundle/deb/"*.deb out/friends-live_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: live-linux
          path: apps/live/out/friends-live_amd64.deb
          if-no-files-found: error

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, live-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: live-linux
          path: downloads
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/friends
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
